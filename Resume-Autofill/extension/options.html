<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Resume AutoFill - Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="wrap">
    <h1>Resume AutoFill Settings</h1>

    <section>
      <h2>About</h2>
      <p class="hint">This extension uses a shared backend to run the AI matching — there's no API key to manage. Usage is rate-limited per user to keep things fair.</p>
    </section>

    <section>
      <h2>Your resume profile</h2>
      <p class="hint">Edit any field Claude got wrong. This is what gets used to fill forms.</p>
      <textarea id="profileJson" rows="20" spellcheck="false"></textarea>
      <button id="saveProfileBtn">Save profile</button>
      <p id="profileStatus" class="status"></p>
    </section>
  </div>
  <script src="options.js"></script>
</body>
</html>
